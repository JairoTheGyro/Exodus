# Compatibility overlay: the base Compose now serves HTTPS directly from
# Vaultwarden. Existing operator commands may continue including this file.
# A prepared, trusted localhost certificate is required; no proxy is created.
services:
  vaultwarden:
    environment:
      ROCKET_TLS: '{certs="/run/tls/cert.pem",key="/run/tls/key.pem"}'
