name: Exodus offline baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: exodus-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-baseline:
    name: Cloud development offline baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Prepare isolated development environment
        run: bash scripts/cloud_setup.sh
      # This focused offline check supplements the full CI suite; it does not
      # replace application integration tests or start production services.
      - name: Verify offline development baseline
        run: .venv/bin/python scripts/cloud_test.py
